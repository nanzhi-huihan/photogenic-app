name: Build All APKs

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # === 任务1: 踩点拍照 APP (Flutter) ===
  build-flutter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build Flutter APK
        run: flutter build apk --release

      - name: Upload Flutter APK
        uses: actions/upload-artifact@v4
        with:
          name: photogenic-flutter-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # === 任务2: 蓝牙门禁 APP (Android Java) ===
  build-smartlock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        run: |
          sudo apt-get update && sudo apt-get install -y gradle

      - name: Build SmartLock APK
        working-directory: smartlock
        run: gradle assembleDebug

      - name: Upload SmartLock APK
        uses: actions/upload-artifact@v4
        with:
          name: smartlock-apk
          path: smartlock/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
