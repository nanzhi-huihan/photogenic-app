name: photogenic
description: AI 踩点拍照 - 单人出游也能拍出有人打卡照
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  camera: ^0.10.5+7
  image_picker: ^1.0.7
  permission_handler: ^11.2.0
  http: ^1.2.0
  path_provider: ^2.1.2
  share_plus: ^7.2.1
  flutter_image_compress: ^2.1.0
  provider: ^6.1.1
  uuid: ^4.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
